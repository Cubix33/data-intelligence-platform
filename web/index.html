<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scout — AI Data Intelligence Platform</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #131720;
    --panel-2: #1a2029;
    --border: #262d3a;
    --text: #e8ecf3;
    --muted: #8b93a7;
    --accent: #ff7a45;
    --accent-2: #4dd4c4;
    --ok: #4dd4c4;
    --warn: #f2c94c;
    --err: #ff6b6b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header {
    padding: 28px 32px 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  main { padding: 24px 32px 64px; max-width: 1200px; margin: 0 auto; }

  .prompt-bar {
    display: flex; gap: 10px; margin-bottom: 20px;
  }
  .prompt-bar input {
    flex: 1; padding: 13px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px;
  }
  .prompt-bar input:focus { outline: none; border-color: var(--accent); }
  .prompt-bar button {
    padding: 13px 22px; border-radius: 10px; border: none; background: var(--accent);
    color: #1a0f08; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  .prompt-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

  .recipes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .recipes button {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font-size: 12px; cursor: pointer;
  }
  .recipes button:hover { color: var(--text); border-color: var(--accent-2); }

  .status-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px; margin-bottom: 20px; display: none;
  }
  .status-card.visible { display: block; }
  .status-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .dot.done { background: var(--ok); }
  .dot.failed { background: var(--err); }
  .status-row strong { color: var(--text); text-transform: capitalize; }
  .stats { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
  .stats div { font-size: 12px; color: var(--muted); }
  .stats b { color: var(--text); font-size: 15px; display: block; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { font-size: 14px; margin: 0; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .panel-head a {
    color: var(--accent-2); text-decoration: none; font-size: 13px; border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 8px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:hover td { background: var(--panel-2); }
  td.cell { cursor: pointer; }
  td.cell.unverified { color: var(--muted); font-style: italic; }
  .badge {
    display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 999px;
    margin-left: 6px; background: rgba(77,212,196,0.15); color: var(--ok);
  }

  .empty { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }

  #drawer {
    position: fixed; top: 0; right: -380px; width: 360px; height: 100%; background: var(--panel);
    border-left: 1px solid var(--border); transition: right 0.2s ease; padding: 22px; overflow-y: auto;
  }
  #drawer.open { right: 0; }
  #drawer h3 { margin-top: 0; font-size: 15px; }
  #drawer .quote {
    background: var(--panel-2); border-left: 3px solid var(--accent-2); padding: 10px 12px;
    border-radius: 6px; font-size: 13px; line-height: 1.5; margin: 10px 0;
  }
  #drawer a { color: var(--accent-2); font-size: 12px; word-break: break-all; }
  #drawer .close { float: right; cursor: pointer; color: var(--muted); font-size: 18px; }

  .sources-list { padding: 8px 18px 18px; font-size: 12px; color: var(--muted); max-height: 160px; overflow-y: auto; }
  .sources-list div { padding: 4px 0; border-bottom: 1px dashed var(--border); }
</style>
</head>
<body>

<header>
  <h1>Scout <span>/</span> AI Data Intelligence Platform</h1>
  <p>Describe a dataset in plain English. Every value you get back is source-backed and traceable.</p>
</header>

<main>
  <div class="prompt-bar">
    <input id="prompt" placeholder="e.g. Find companies that sponsored student hackathons in India in 2025, with sponsorship tier and contact URL" />
    <button id="runBtn" onclick="startRun()">Run</button>
  </div>

  <div class="recipes">
    <button onclick="fillRecipe(0)">Hackathon sponsors in India 2025</button>
    <button onclick="fillRecipe(1)">Remote backend jobs at fintech startups</button>
    <button onclick="fillRecipe(2)">D2C skincare brands in India</button>
  </div>

  <div class="status-card" id="statusCard">
    <div class="status-row">
      <span class="dot" id="statusDot"></span>
      <span>Status: <strong id="statusText">—</strong></span>
    </div>
    <div class="stats" id="statsRow"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2 id="resultsTitle">Results</h2>
      <a id="exportLink" href="#" target="_blank">Export CSV</a>
    </div>
    <div id="tableWrap"><div class="empty">Run a prompt above to see results here.</div></div>
    <div class="panel-head" style="border-top:1px solid var(--border); border-bottom:none;">
      <h2>Source Ledger</h2>
    </div>
    <div class="sources-list" id="sourcesList"></div>
  </div>
</main>

<div id="drawer">
  <span class="close" onclick="closeDrawer()">✕</span>
  <h3 id="drawerField"></h3>
  <div id="drawerBody"></div>
</div>

<script>
const API = "http://localhost:8000/api";
let currentRunId = null;
let pollTimer = null;

const RECIPES = [
  "Find companies that sponsored student hackathons in India in 2025. Include the sponsorship tier, their website, and a partnership/contact page.",
  "Find remote backend engineering jobs at fintech startups in India posted in the last month, with company name, role, seniority, and the job posting URL.",
  "Find D2C skincare brands based in India, with their website, product category, and Instagram handle.",
];

function fillRecipe(i) {
  document.getElementById("prompt").value = RECIPES[i];
}

async function startRun() {
  const prompt = document.getElementById("prompt").value.trim();
  if (!prompt) return;

  const btn = document.getElementById("runBtn");
  btn.disabled = true;
  btn.textContent = "Starting…";

  try {
    const res = await fetch(`${API}/runs`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    currentRunId = data.id;
    document.getElementById("statusCard").classList.add("visible");
    document.getElementById("exportLink").href = `${API}/runs/${currentRunId}/export.csv`;
    poll();
  } catch (err) {
    alert("Could not start run: " + err.message + "\n\nIs the API running at " + API + "?");
    btn.disabled = false;
    btn.textContent = "Run";
  }
}

function poll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    const res = await fetch(`${API}/runs/${currentRunId}`);
    const run = await res.json();
    render(run);
    if (run.status === "done" || run.status === "failed") {
      document.getElementById("runBtn").disabled = false;
      document.getElementById("runBtn").textContent = "Run";
    } else {
      poll();
    }
  }, 1200);
}

function render(run) {
  const dot = document.getElementById("statusDot");
  dot.className = "dot " + (run.status === "done" ? "done" : run.status === "failed" ? "failed" : "");
  document.getElementById("statusText").textContent = run.status + (run.error ? `: ${run.error}` : "");

  const statsRow = document.getElementById("statsRow");
  statsRow.innerHTML = "";
  if (run.stats) {
    for (const [key, val] of Object.entries(run.stats)) {
      statsRow.innerHTML += `<div><b>${val}</b>${key.replaceAll("_", " ")}</div>`;
    }
  }

  const fields = (run.data_spec && run.data_spec.fields) || [];
  document.getElementById("resultsTitle").textContent =
    run.data_spec ? `Results — ${run.data_spec.entity}` : "Results";

  const wrap = document.getElementById("tableWrap");
  const records = run.records || [];
  if (!fields.length) {
    wrap.innerHTML = `<div class="empty">Planning the workflow…</div>`;
  } else if (!records.length) {
    wrap.innerHTML = `<div class="empty">No records yet — still collecting.</div>`;
  } else {
    let html = "<table><thead><tr>";
    for (const f of fields) html += `<th>${f.name}</th>`;
    html += "<th>confidence</th></tr></thead><tbody>";
    records.forEach((rec, ri) => {
      html += "<tr>";
      for (const f of fields) {
        const val = rec.fields[f.name];
        const prov = rec.provenance[f.name] || {};
        const cls = prov.verified ? "cell" : "cell unverified";
        html += `<td class="${cls}" onclick='openDrawer(${ri}, "${f.name}")'>${val ?? "—"}${
          prov.corroborated_by ? '<span class="badge">✓✓</span>' : ""
        }</td>`;
      }
      html += `<td>${rec.confidence}</td></tr>`;
    });
    html += "</tbody></table>";
    wrap.innerHTML = html;
  }
  window._records = records;

  const sourcesList = document.getElementById("sourcesList");
  const sources = run.sources || [];
  sourcesList.innerHTML = sources.length
    ? sources.map(s => `<div>[${s.status}] ${s.url} ${s.reason ? "— " + s.reason : ""} ${s.records_found ? `(+${s.records_found})` : ""}</div>`).join("")
    : `<div>No sources touched yet.</div>`;
}

function openDrawer(recordIndex, fieldName) {
  const rec = window._records[recordIndex];
  const prov = rec.provenance[fieldName] || {};
  document.getElementById("drawerField").textContent = fieldName;
  document.getElementById("drawerBody").innerHTML = `
    <div class="quote">${prov.evidence ? '"' + prov.evidence + '"' : "No verified evidence — value was dropped."}</div>
    <div>Source: <a href="${prov.url || "#"}" target="_blank">${prov.url || "—"}</a></div>
    <div style="margin-top:8px; color: var(--muted); font-size:12px;">
      ${prov.verified ? "✓ Verified against the fetched page" : "⚠ Not verified"}
      ${prov.corroborated_by ? `<br/>Also confirmed by: ${prov.corroborated_by}` : ""}
    </div>
  `;
  document.getElementById("drawer").classList.add("open");
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
}
</script>

</body>
</html>
